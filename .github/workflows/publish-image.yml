# Test, tag and publish the service image (Dockerfile at the repo root), in the
# same shape as sdp-knowledge-center's CI:
#
#   1. checks   run the test suite
#   2. tag      read `version` from pyproject.toml and push the Git tag
#               <version> on this commit (fails if that tag names another
#               commit: bump the version first)
#   3. publish  push ghcr.io/softnixtech/pii-redaction-service as
#               :<12-char SHA>, :<version> and :latest
#
# Deploy: `docker login ghcr.io` (a token with read:packages), then
# `docker compose pull && docker compose up -d`; docker-compose.yml names the
# :latest image.
name: CI, tag and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q

  tag:
    name: Tag source version
    needs: checks
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify branch head and version
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$CURRENT_SHA" != "$GITHUB_SHA" ]]; then
            echo 'Branch advanced while checks ran; tag its latest commit instead.' >&2
            exit 1
          fi
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version in pyproject.toml: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Create Git tag
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            EXISTING_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $VERSION already points to another commit. Bump the version in pyproject.toml before pushing." >&2
              exit 1
            fi
            echo "Tag $VERSION already points to this commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$VERSION" "$GITHUB_SHA" \
              -m "Release $VERSION" -m "Source commit: $GITHUB_SHA" -m "Image SHA: ${GITHUB_SHA:0:12}"
            git push origin "refs/tags/$VERSION"
          fi

  publish:
    name: Build and publish image
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/softnixtech/pii-redaction-service
      VERSION: ${{ needs.tag.outputs.version }}
      TAG: ${{ needs.tag.outputs.image_tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.TAG }}
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
            ${{ env.IMAGE_REPO }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        run: |
          {
            echo "### Published $VERSION (build $TAG)"
            echo
            echo "$IMAGE_REPO:$TAG"
            echo "$IMAGE_REPO:$VERSION"
            echo "$IMAGE_REPO:latest"
          } >> "$GITHUB_STEP_SUMMARY"
