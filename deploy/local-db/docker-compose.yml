# Local PII manifest store (Postgres + PostgREST) and the redaction service,
# reachable from this machine only.
# Start from this folder:  docker compose --env-file ../../.env up -d
name: pii-local-store

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pii
      POSTGRES_USER: pii_admin
      POSTGRES_PASSWORD: ${PII_DB_ADMIN_PASSWORD:?set PII_DB_ADMIN_PASSWORD in .env}
      PII_DB_AUTHENTICATOR_PASSWORD: ${PII_DB_AUTHENTICATOR_PASSWORD:?set PII_DB_AUTHENTICATOR_PASSWORD in .env}
    volumes:
      - pii_store_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pii_admin -d pii"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # postgrest/postgrest:v12.2.3, copied to GHCR by the publish workflow.
    image: ${PII_STORE_API_IMAGE:-ghcr.io/softnixtech/pii-store-api:latest}
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${PII_DB_AUTHENTICATOR_PASSWORD}@db:5432/pii
      PGRST_DB_SCHEMAS: api
      PGRST_JWT_SECRET: ${PII_DB_JWT_SECRET:?set PII_DB_JWT_SECRET in .env}
    ports:
      - "127.0.0.1:3000:3000"
      # The service shares this container's network (below), so its port is published here.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # The redaction service. It shares the api container's network namespace, so
  # PII_STORE_URL=http://127.0.0.1:3000 reaches PostgREST and still passes the
  # service's "unencrypted test manifests are stored locally only" check.
  service:
    build:
      context: ../..
    # From GHCR (docker login ghcr.io first); pin with PII_SERVICE_IMAGE=...:<version>.
    image: ${PII_SERVICE_IMAGE:-ghcr.io/softnixtech/pii-redaction-service:latest}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PII_STORE_URL: http://127.0.0.1:3000
    network_mode: "service:api"
    read_only: true
    stop_grace_period: 25m   # longer than PII_SERVICE_REQUEST_DEADLINE_SECONDS
    depends_on:
      api:
        condition: service_started

volumes:
  pii_store_data: